name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Reads release-please-config.json and .release-please-manifest.json.
      # Merges to main accumulate into a Release PR; merging that PR tags the
      # release and sets release_created, which gates the jobs below.
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # The environment name must match the npm Trusted Publisher configuration.
    environment: npm
    permissions:
      contents: read
      id-token: write  # OIDC for npm Trusted Publishing (no NPM_TOKEN) + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - name: Ensure a Trusted-Publishing-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # prepublishOnly builds dist/cli.js from the release-bumped package.json.
      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC Trusted Publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public

  build-binaries:
    name: Binary (${{ matrix.out }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    # impit ships a per-platform native binary, so each target must be compiled
    # on its own OS/arch runner (cross-compiling embeds the wrong impit binary).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, out: blitzy-linux-x64 }
          - { runner: ubuntu-24.04-arm, out: blitzy-linux-arm64 }
          - { runner: macos-13, out: blitzy-darwin-x64 }
          - { runner: macos-latest, out: blitzy-darwin-arm64 }
          - { runner: windows-latest, out: blitzy-windows-x64.exe }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Installs this platform's prebuilt impit binary, which --compile embeds.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        shell: bash
        run: bun build --compile ./src/cli.js --outfile dist/${{ matrix.out }}

      # Runs the freshly built binary to prove it works (and that impit loaded).
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.out }} --version

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/${{ matrix.out }}
          fail_on_unmatched_files: true
