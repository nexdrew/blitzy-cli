name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Reads release-please-config.json and .release-please-manifest.json.
      # Merges to main accumulate into a Release PR; merging that PR tags the
      # release and sets release_created, which gates the jobs below.
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # The environment name must match the npm Trusted Publisher configuration.
    environment: npm
    permissions:
      contents: read
      id-token: write  # OIDC for npm Trusted Publishing (no NPM_TOKEN) + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - name: Ensure a Trusted-Publishing-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # prepublishOnly builds dist/cli.js from the release-bumped package.json.
      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC Trusted Publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public

  build-binaries:
    name: Binary (${{ matrix.out }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write      # upload assets to the GitHub Release
      id-token: write      # OIDC identity for Sigstore signing
      attestations: write  # store the build-provenance attestation
    # impit ships a per-platform native binary, so each target must be compiled
    # on its own OS/arch runner (cross-compiling embeds the wrong impit binary).
    # x64 legs install Bun's -baseline flavor (no AVX/AVX2 requirement): the
    # standard builds warn about "strange crashes" — and genuinely can crash —
    # on pre-2013 x86 CPUs and under Rosetta 2 on Apple Silicon, where an
    # x86_64 Homebrew installs the darwin-x64 binary. arm64 has no baseline
    # variant (not applicable). Each leg installs the exact flavor it ships via
    # bun-download-url and compiles with NO --target, embedding the running
    # runtime: `--target` makes bun download a runtime zip mid-compile, which
    # deterministically failed on the windows runner ("Failed to extract
    # executable", v1.2.1) and is a network flake risk everywhere else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, out: blitzy-linux-x64, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-baseline.zip' }
          - { runner: ubuntu-24.04-arm, out: blitzy-linux-arm64, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-linux-aarch64.zip' }
          - { runner: macos-26-intel, out: blitzy-darwin-x64, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-x64-baseline.zip' }
          - { runner: macos-latest, out: blitzy-darwin-arm64, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-aarch64.zip' }
          - { runner: windows-latest, out: blitzy-windows-x64.exe, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64-baseline.zip' }
          - { runner: windows-11-arm, out: blitzy-windows-arm64.exe, bun-url: 'https://github.com/oven-sh/bun/releases/latest/download/bun-windows-aarch64.zip' }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: ${{ matrix.bun-url }}

      # Installs this platform's prebuilt impit binary, which --compile embeds.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No --target: embeds the running bun (the exact flavor installed above),
      # so nothing is downloaded mid-compile.
      - name: Compile standalone binary
        shell: bash
        run: bun build --compile ./src/cli.js --outfile dist/${{ matrix.out }}

      # Runs the freshly built binary to prove it works (and that impit loaded).
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.out }} --version

      # Signed provenance linking the binary to this repo + workflow run.
      # Users verify with: gh attestation verify <file> --repo nexdrew/blitzy-cli
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.out }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/${{ matrix.out }}
          fail_on_unmatched_files: true

  # musl (Alpine) needs its own build: JS-based actions can't run inside an
  # Alpine container, so compile via the official oven/bun:alpine image instead.
  # This installs impit-linux-x64-musl, which --compile embeds.
  build-binary-musl:
    name: Binary (blitzy-linux-x64-musl)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload assets to the GitHub Release
      id-token: write      # OIDC identity for Sigstore signing
      attestations: write  # store the build-provenance attestation
    steps:
      - uses: actions/checkout@v7

      # The alpine image's installed bun is the non-baseline musl flavor, so
      # this leg still needs --target (mid-compile runtime download). That
      # worked fine on linux runners, but retry anyway since a truncated
      # download fails the compile ("Failed to extract executable").
      - name: Compile standalone musl binary in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w oven/bun:alpine sh -c '
            bun install --frozen-lockfile || exit 1
            for attempt in 1 2 3; do
              if bun build --compile --target=bun-linux-x64-musl-baseline ./src/cli.js --outfile dist/blitzy-linux-x64-musl; then
                exec ./dist/blitzy-linux-x64-musl --version
              fi
              echo "compile attempt ${attempt} failed; clearing bun cache and retrying in 15s..."
              rm -rf "$HOME/.bun/install/cache" 2>/dev/null || true
              sleep 15
            done
            echo "compile failed after 3 attempts"
            exit 1
          '

      # Signed provenance linking the binary to this repo + workflow run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/blitzy-linux-x64-musl

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/blitzy-linux-x64-musl
          fail_on_unmatched_files: true

  # Regenerates Formula/blitzy-cli.rb in nexdrew/homebrew-tap from this
  # release's asset digests. Waits on build-binaries so all four formula
  # assets (darwin/linux x arm64/x64) are uploaded with digests recorded.
  # Requires the TAP_GITHUB_TOKEN secret: a fine-grained PAT with
  # contents: write on nexdrew/homebrew-tap.
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Render formula from release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | node scripts/homebrew-formula.mjs > blitzy-cli.rb
          ruby -c blitzy-cli.rb
          cat blitzy-cli.rb

      - name: Push formula to nexdrew/homebrew-tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/nexdrew/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp blitzy-cli.rb tap/Formula/blitzy-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/blitzy-cli.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
            exit 0
          fi
          git commit -m "blitzy-cli ${TAG}"
          git push origin HEAD

  # Regenerates bucket/blitzy-cli.json in nexdrew/scoop-bucket from this
  # release's Windows asset digests. Waits on build-binaries so both Windows
  # exes (x64/arm64) are uploaded with digests recorded. Requires the
  # SCOOP_GITHUB_TOKEN secret: a fine-grained PAT with contents: write on
  # nexdrew/scoop-bucket.
  update-scoop-bucket:
    name: Update Scoop bucket
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Render manifest from release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | node scripts/scoop-manifest.mjs > blitzy-cli.json
          node -e "JSON.parse(require('node:fs').readFileSync('blitzy-cli.json', 'utf8'))"
          cat blitzy-cli.json

      - name: Push manifest to nexdrew/scoop-bucket
        env:
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${SCOOP_GITHUB_TOKEN}@github.com/nexdrew/scoop-bucket.git" bucket-repo
          mkdir -p bucket-repo/bucket
          cp blitzy-cli.json bucket-repo/bucket/blitzy-cli.json
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/blitzy-cli.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to push."
            exit 0
          fi
          git commit -m "blitzy-cli ${TAG}"
          git push origin HEAD
