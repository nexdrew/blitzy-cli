name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # bun's bunfig coverageThreshold doesn't fail the run, so gate on the
      # parsed line-coverage of the "All files" row instead (version-independent).
      - name: Test (coverage gate >= 95% lines)
        run: |
          bun test --coverage 2>&1 | tee /tmp/coverage.txt
          line=$(awk -F'|' '/^All files/ { gsub(/[ %]/,"",$3); print $3 }' /tmp/coverage.txt)
          echo "Line coverage: ${line}%"
          awk -v c="${line:-0}" 'BEGIN { if (c+0 < 95) { print "::error::Line coverage " c "% is below the 95% gate"; exit 1 } }'

      - name: Build
        run: bun run build

      - name: Smoke test the bundle
        run: node dist/cli.js --version
